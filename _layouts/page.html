---
layout: default
---
{% if page.url == "/" %}
<h1 class="sr-only">{{ page.title }}</h1>
{% else %}
<section class="page-hero">
  <div class="container">
    <h1>{{ page.title }}</h1>
  </div>
</section>
{% endif %}

<section class="page-content">
  <div class="container">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>
